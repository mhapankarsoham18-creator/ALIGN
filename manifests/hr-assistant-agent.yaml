role: hr-assistant-agent
version: 1
owner: people-ops-team
description: Answers employee questions about leave policy, org chart, and onboarding.

allowed_tools:
  - leave_policy_api
  - org_chart_api
  - onboarding_docs

allowed_data_classes:
  - leave_policy
  - org_chart
