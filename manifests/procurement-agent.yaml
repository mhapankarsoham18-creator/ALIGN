# AIDDS Role Manifest — Procurement Agent
# See: docs/05_Role_Manifest_Spec.pdf

role: procurement-agent
version: 3
owner: procurement-platform-team
description: Checks supplier prices and creates purchase requests.

allowed_tools:
  - supplier_price_api
  - read_catalog
  - create_purchase_request

allowed_data_classes:
  - supplier
  - pricing
  - purchase_request

forbidden_data_classes:
  - hr
  - payroll
  - finance_ledger

egress_allowlist:
  - api.approved-supplier.com
  - erp.internal

limits:
  max_records_per_call: 200
  max_bytes_out_per_hour: 5000000
  max_calls_per_minute: 60

requires_approval:
  - tool: create_purchase_request
    when: "amount > 100000"

delegation:
  may_call:
    - pricing-analyst-agent
  pass_scopes:
    - read_catalog

honeypots:
  - hr/salaries_2026_FULL.xlsx

